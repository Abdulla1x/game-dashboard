<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Library</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-text">Library</span>
      <span class="count" id="count"></span>
    </div>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search games…" autocomplete="off" spellcheck="false">
      <kbd class="hint">/</kbd>
    </div>

    <div class="controls">
      <div class="seg" id="view-toggle" role="group" aria-label="Which games to show">
        <button type="button" data-view="installed" title="Only games installed on this PC">Installed</button>
        <button type="button" data-view="all" title="Everything in your libraries, installed or not">All</button>
      </div>
      <select id="sort" title="Sort">
        <option value="name">Name</option>
        <option value="last">Last played</option>
        <option value="playtime">Playtime</option>
        <option value="size">Size on disk</option>
      </select>
      <button id="add-btn" class="ghost" title="Add a game or app by hand">+ Add</button>
      <button id="sizes-btn" class="ghost" title="Walk folders to measure size on disk">Measure sizes</button>
      <button id="rescan-btn" class="ghost" title="Rescan all sources">Rescan</button>
      <button id="settings-btn" class="ghost" title="Settings" aria-label="Settings">&#9881;</button>
    </div>
  </header>

  <nav class="filters" id="filters"></nav>

  <main>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>Nothing matches that search.</p>

    <section id="firstrun" class="firstrun" hidden>
      <h2>No games yet</h2>
      <p>Steam, Epic, Xbox and Riot are found on their own. Game folders that do not
         belong to a launcher need pointing at once &mdash; your drives have already
         been scanned for likely candidates.</p>
      <button id="firstrun-btn" class="primary">Choose game folders&hellip;</button>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <div id="menu" class="menu" hidden role="menu"></div>

  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="modal-title">Title</h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost">Cancel</button>
        <button id="modal-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
